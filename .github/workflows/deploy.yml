name: Deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web-dashboard
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Unit tests
        run: bun test src/services/mappers.test.js

      - name: Integration tests
        run: bun test src/services/gatewayApi.integration.test.js

      - name: Production build
        env:
          VITE_GATEWAY_URL: https://cache.us.kg
        run: bun run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          printf 'Host %s\n  StrictHostKeyChecking accept-new\n' "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/config

      - name: Sync dashboard to server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          BASE: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude '.env' \
            ./ "${USER}@${HOST}:${BASE}/web-dashboard/"

      - name: Build and restart dashboard + edge
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          BASE: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "${USER}@${HOST}" \
            "cd '${BASE}/omnichannel-backend/deployment' && chmod +x deploy.sh && ./deploy.sh dashboard edge"
